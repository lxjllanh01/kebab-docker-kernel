name: build-kebab-los-docker-kernel

# v30：改走 LineageOS 官方源码树（自洽、全量 oplus 驱动、全模块自建），
# 目标设备 kebab / OnePlus 8T，对齐官方 nightly 20261023（LOS 24.0）。
# 内核 commit 取自该构建的 build-manifest.xml：
#   LineageOS/android_kernel_oneplus_sm8250 @ 98a7970af93b7e01ee77156e7fa0eb7e059a57f0
# 配置基线按设备 BoardConfigCommon.mk：
#   TARGET_KERNEL_CONFIG := vendor/kona-perf_defconfig vendor/oplus.config
# 仅叠加 Docker 需要的命名空间/cgroup/netfilter 开关，并把模块强制签名关掉
# （LOS 官方模块由其构建密钥签名，我们复现不出，关掉后只 taint 不拒绝）。
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核仓库'
        required: false
        default: 'LineageOS/android_kernel_oneplus_sm8250'
      kernel_commit:
        description: '内核 commit（须与 LOS 构建清单一致）'
        required: false
        default: '98a7970af93b7e01ee77156e7fa0eb7e059a57f0'
      los_boot_url:
        description: '对照用 LOS boot.img 地址'
        required: false
        default: 'https://mirror.accum.se/mirror/lineageos/full/kebab/20261023/boot.img'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 安装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            make bc bison flex libssl-dev libelf-dev python3 \
            device-tree-compiler cpio rsync kmod zip
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          clang --version | head -1
          ld.lld --version | head -1

      - name: 拉取 LOS 内核源码（锁定 commit）
        run: |
          git init kernel
          git -C kernel remote add origin "https://github.com/${{ inputs.kernel_repo }}.git"
          git -C kernel fetch --depth=1 origin "${{ inputs.kernel_commit }}"
          git -C kernel checkout --detach FETCH_HEAD
          cd kernel
          echo "== HEAD =="; git rev-parse HEAD
          echo "== 版本 =="; grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile
          echo "== 悬空符号链接 =="; find . -xtype l | wc -l
          for d in drivers/soc/oplus techpack/display techpack/camera kernel/sched_assist; do
            printf '  %-22s %s 个文件\n' "$d" "$(find $d -type f 2>/dev/null | wc -l)"
          done

      - name: 写入 Docker 配置片段
        run: |
          cat > docker.config <<'EOF'
          # Docker 必需（LOS 基线里 PID_NS 是关的）
          CONFIG_PID_NS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IPC_NS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_VETH=y
          CONFIG_OVERLAY_FS=y
          CONFIG_BRIDGE=y
          # LOS 官方模块由其构建密钥签名，我们复现不出；关掉强制校验（只 taint 不拒绝）
          # CONFIG_MODULE_SIG_FORCE is not set
          EOF
          cat docker.config

      - name: 生成配置（defconfig + oplus 片段 + docker 片段）
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          MAKEFLAGS_CC="CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 DTC_EXT=/usr/bin/dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          echo "MAKEFLAGS_CC=$MAKEFLAGS_CC"
          make O=out $MAKEFLAGS_CC vendor/kona-perf_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/oplus.config "$GITHUB_WORKSPACE/docker.config"
          make O=out $MAKEFLAGS_CC olddefconfig
          echo "===== 关键项 ====="
          for k in CONFIG_PID_NS CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS CONFIG_BRIDGE_NETFILTER \
                   CONFIG_IPC_NS CONFIG_VETH CONFIG_OVERLAY_FS CONFIG_MEMCG CONFIG_BRIDGE \
                   CONFIG_MODVERSIONS CONFIG_MODULE_SIG CONFIG_MODULE_SIG_FORCE \
                   CONFIG_SPECTRA_CAMERA CONFIG_LOCALVERSION CONFIG_PREEMPT CONFIG_SMP; do
            printf '%-34s %s\n' "$k" "$(grep -E "^$k=|^# $k is not set" out/.config | head -1)"
          done
          grep -q '^CONFIG_PID_NS=y' out/.config || { echo "!! PID_NS 未打开"; exit 1; }
          grep -q '^CONFIG_CGROUP_DEVICE=y' out/.config || { echo "!! CGROUP_DEVICE 未打开"; exit 1; }
          grep -q '^CONFIG_BRIDGE_NETFILTER=y' out/.config || { echo "!! BRIDGE_NETFILTER 未打开"; exit 1; }
          # MODULE_SIG 本身关掉时，MODULE_SIG_FORCE 在 .config 里根本不存在，属正常
          if grep -q '^CONFIG_MODULE_SIG=y' out/.config; then
            grep -qE '^(# CONFIG_MODULE_SIG_FORCE is not set|CONFIG_MODULE_SIG_FORCE=n)' out/.config \
              || { echo "!! 模块强制签名未关闭"; exit 1; }
            echo "MODULE_SIG 已启用但未强制，OK"
          else
            echo "MODULE_SIG 未启用，强制签名天然不存在，OK"
          fi

      - name: 编译内核与模块
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          set -o pipefail
          MAKEFLAGS_CC="CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 DTC_EXT=/usr/bin/dtc \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make -j"$(nproc)" O=out $MAKEFLAGS_CC Image 2>&1 | tee ../kernel-build.log
          make -j"$(nproc)" O=out $MAKEFLAGS_CC modules 2>&1 | tee ../modules-build.log
          ls -la out/arch/arm64/boot/Image

      - name: 打包 boot.img（支持内核变大，重建布局）
        run: |
          set -o pipefail
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image artifacts/Image
          cp kernel/out/.config artifacts/kernel.config
          cp kernel/out/Module.symvers artifacts/Module.symvers || true
          ( cd kernel/out && find . -name '*.ko' -print0 | tar --null -czf "$GITHUB_WORKSPACE/artifacts/modules.tar.gz" -T - ) || true
          curl -sL --fail -o stock-los-boot.img "${{ inputs.los_boot_url }}"
          python3 - <<'PY'
          import hashlib, struct, sys
          d = open('stock-los-boot.img', 'rb').read()
          assert d[:8] == b'ANDROID!', 'boot.img 魔数不对'
          u32 = lambda o: struct.unpack_from('<I', d, o)[0]
          u64 = lambda o: struct.unpack_from('<Q', d, o)[0]
          page = u32(0x24)
          hdr = u32(0x66C) or page
          ksize, rsize, ssize = u32(0x08), u32(0x10), u32(0x18)
          rd_size, dtb_size = u32(0x660), u32(0x670)
          def align(x, a=page): return (x + a - 1) // a * a
          k_off = align(hdr)
          r_off = align(k_off + ksize)
          s_off = align(r_off + rsize)
          rd_off = align(s_off + ssize)
          dtb_off = align(rd_off + rd_size)
          assert d[k_off+0x38:k_off+0x3C] == b'ARM\x64', '内核段偏移解析错误'
          print(f'LOS boot.img {len(d)} 字节 page={page} hdr={hdr}')
          print(f'原布局 kernel={ksize} ramdisk={rsize} dtbo={rd_size} dtb={dtb_size}')
          kernel = open('kernel/out/arch/arm64/boot/Image', 'rb').read()
          print(f'新内核 {len(kernel)} 字节（比原内核区 {len(kernel)-ksize:+d}）')
          ramdisk = d[r_off:r_off+rsize]
          second  = d[s_off:s_off+ssize]
          dtbo    = d[rd_off:rd_off+rd_size]
          dtb     = d[dtb_off:dtb_off+dtb_size]
          foot = d[-64:]
          vbmeta = b''
          if foot[:4] == b'AVBf':
              orig, vbo, vbs = struct.unpack_from('>QQQ', foot, 12)
              assert vbo + vbs <= len(d) - 64, 'vbmeta 位置异常'
              vbmeta = d[vbo:vbo+vbs]
              print(f'AVB footer vbmeta@{vbo} size={vbs}')
          else:
              print('!! 未找到 AVB footer，按无 footer 处理')
          out = bytearray(len(d))
          out[0:page] = d[0:page]
          pos = align(hdr)
          nk = pos; out[pos:pos+len(kernel)] = kernel; pos = align(pos+len(kernel))
          nr = pos; out[pos:pos+len(ramdisk)] = ramdisk; pos = align(pos+len(ramdisk))
          ns = pos; out[pos:pos+len(second)] = second; pos = align(pos+len(second))
          nd = pos; out[pos:pos+len(dtbo)] = dtbo; pos = align(pos+len(dtbo))
          nb = pos; out[pos:pos+len(dtb)] = dtb; pos = align(pos+len(dtb))
          data_end = pos
          vbo_new = align(data_end)
          if vbmeta:
              assert vbo_new + len(vbmeta) + 64 <= len(d), '数据区过大，vbmeta/footer 放不下'
              out[vbo_new:vbo_new+len(vbmeta)] = vbmeta
              nf = bytearray(foot)
              struct.pack_into('>Q', nf, 12, vbo_new)
              struct.pack_into('>Q', nf, 20, vbo_new)
              struct.pack_into('>Q', nf, 28, len(vbmeta))
              out[-64:] = bytes(nf)
          struct.pack_into('<I', out, 0x08, len(kernel))
          sha = hashlib.sha1()
          for blob in (kernel, ramdisk, second, dtbo, dtb):
              sha.update(blob); sha.update(struct.pack('<I', len(blob)))
          out[0x240:0x254] = sha.digest()
          out[0x254:0x260] = b'\x00' * 12
          open('artifacts/boot-kebab-los-docker.img','wb').write(bytes(out))
          chk = open('artifacts/boot-kebab-los-docker.img','rb').read()
          assert chk[nk+0x38:nk+0x3C] == b'ARM\x64', '内核 ARM64 magic 不对'
          assert chk[nr:nr+len(ramdisk)] == ramdisk, 'ramdisk 不一致'
          assert chk[nb:nb+8] == dtb[:8], 'dtb 不一致'
          if vbmeta: assert chk[-64:-60] == b'AVBf', 'footer 不在末尾'
          print(f'新布局 kernel@{nk} ramdisk@{nr} dtbo@{nd} dtb@{nb} data_end={data_end} vbmeta@{vbo_new}')
          print('打包完成', len(chk), '字节')
          PY
          ls -la artifacts/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kebab-los-docker
          path: |
            artifacts/
            kernel-build.log
            modules-build.log
          if-no-files-found: warn
          retention-days: 14
