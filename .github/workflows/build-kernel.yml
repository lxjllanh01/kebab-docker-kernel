name: build-kebab-docker-kernel

# 用法：Actions → build-kebab-docker-kernel → Run workflow
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: '官方源码分支（A14 / 4.19.157）'
        required: false
        default: 'oneplus/sm8250_u_14.0.0_op8t'
      fixup_branch:
        description: '补齐源分支（含 sched_assist/tuning/uad）'
        required: false
        default: 'bpf-5.15-backport'
      toolchain:
        description: '编译器：clang 或 gcc'
        required: false
        default: 'clang'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 git rsync cpio kmod zip unzip \
            gcc-aarch64-linux-gnu clang-12 lld-12
          clang-12 --version | head -1

      - name: 拉取官方基线源码
        run: |
          git clone --depth=1 -b "${{ inputs.base_branch }}" \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git src
          cd src
          echo "== 版本 =="; grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile
          grep -q 'SUBLEVEL = 157' Makefile || { echo "内核次版本不是 157，中止"; exit 1; }

      - name: 放宽 clang-12 严格告警（顶层 Makefile）
        working-directory: src
        run: |
          # 本构建树不读取 KCFLAGS，-Werror=xxx 写死在顶层 Makefile；
          # clang-12 比原厂 clang-10 严格，把纯风格类告警降级为普通告警，
          # 保留 -Werror-implicit-function-declaration（用于捕获真实 API 缺失）
          sed -i \
            -e 's/-Werror=implicit-int/-Wno-implicit-int/' \
            -e 's/-Werror=strict-prototypes/-Wno-strict-prototypes/' \
            -e 's/-Werror=date-time/-Wno-date-time/' \
            -e 's/-Werror=incompatible-pointer-types/-Wno-incompatible-pointer-types/' \
            -e 's/-Werror=designated-init/-Wno-designated-init/' \
            Makefile
          echo "===== 剩余 Werror 项 ====="
          grep -n 'Werror' Makefile

      - name: 补齐 OPLUS 缺失模块（sched_assist/tuning/uad）
        run: |
          git clone --depth=1 -b "${{ inputs.fixup_branch }}" \
            https://github.com/toraidl/android_kernel_oneplus_sm8250.git fixup
          MISS=0
          for d in kernel/sched_assist kernel/tuning kernel/uad include/linux/sched_assist; do
            if [ -d "fixup/$d" ]; then
              rm -rf "src/$d"
              cp -r "fixup/$d" "src/$d"
              echo "已补齐 $d ($(find src/$d -type f | wc -l) 个文件)"
            else
              echo "!! fixup 仓库缺少 $d"; MISS=1
            fi
          done
          [ "$MISS" = "0" ] || exit 1

      - name: 适配 4.19.157 API（cgroup_id → cgroup_ino）
        working-directory: src
        run: |
          # toraidl 补齐文件基于 4.19.325，使用 cgroup_id()；4.19.157 基线只有 cgroup_ino()，
          # 两者语义一致（返回 cgroup 的 inode 标识），直接替换
          FILES=$(grep -rl 'cgroup_id(' kernel/sched_assist kernel/tuning kernel/uad include/linux/sched_assist 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's/\bcgroup_id(/cgroup_ino(/g'
            echo "已替换 cgroup_id → cgroup_ino:"
            echo "$FILES"
          else
            echo "无需替换"
          fi
          grep -rn '\bcgroup_id(' kernel/sched_assist kernel/tuning kernel/uad include/linux/sched_assist && { echo "!! 仍有残留"; exit 1; } || true

      - name: 适配 4.19.157 API（stack_trace_save 兼容 shim）
        working-directory: src
        run: |
          # toraidl 4.19.325 的 kern_lock_stat.c 用 5.x 的 stack_trace_save()；
          # 4.19.157 基线只有旧式 save_stack_trace() + struct stack_trace（CONFIG_STACKTRACE=y 已确认）
          cat > include/linux/stack_trace_compat.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _STACK_TRACE_COMPAT_H
          #define _STACK_TRACE_COMPAT_H
          /* 5.x stack_trace_save() 的 4.19 兼容实现 */
          #include <linux/stacktrace.h>
          static inline unsigned int stack_trace_save(unsigned long *store,
            unsigned int nr_entries, unsigned int skipnr)
          {
            struct stack_trace trace = {
              .entries = store,
              .max_entries = nr_entries,
              .skip = skipnr,
            };
            save_stack_trace(&trace);
            return trace.nr_entries;
          }
          #endif
          EOF
          for f in kernel/sched_assist/sync/kern_lock_stat.c include/linux/sched_assist/sync/kern_lock_stat.c; do
            if [ -f "$f" ] && ! grep -q stack_trace_compat "$f"; then
              sed -i 's|#include "locking_main.h"|#include "locking_main.h"\n#include <linux/stack_trace_compat.h>|' "$f"
              echo "已注入 compat shim: $f"
            fi
          done

      - name: 修复悬空符号链接（vendor 内部链接）
        working-directory: src
        run: |
          FIXED=0; STUB=0
          while IFS= read -r l; do
            p="${l#./}"
            if [ -e "../fixup/$p" ] && [ ! -L "../fixup/$p" ]; then
              rm -f "$l"; mkdir -p "$(dirname "$l")"
              cp -r "../fixup/$p" "$l"
              FIXED=$((FIXED+1))
            else
              echo "!! 无补齐来源，空文件占位: $p"
              rm -f "$l"; mkdir -p "$(dirname "$l")"; touch "$l"
              STUB=$((STUB+1))
            fi
          done < <(find . -xtype l)
          echo "===== 悬空链接修复统计 ====="
          echo "从补齐分支修复: $FIXED 个"
          echo "空文件占位:     $STUB 个"

      - name: 适配编译（voocphy 严格标志 / sy6529 括号 / IPA fortify 误报）
        working-directory: src
        run: |
          # 注意：本步骤必须在"修复悬空符号链接"之后执行（drivers/power/oplus 原是链接）
          # 1) toraidl 的 voocphy Makefile 加了 -Werror=parentheses 和全局 -Werror，clang-12 下过于严格
          sed -i -e 's/subdir-ccflags-y += -Werror=parentheses/subdir-ccflags-y += -Wno-parentheses/' \
                 -e 's/^subdir-ccflags-y += -Werror$/subdir-ccflags-y += -Wno-error/' \
                 drivers/power/oplus/v1/Makefile
          # 2) sy6529 真实 bug：== 与 | 优先级漏括号
          sed -i 's/\*data == sy6529_CHARGE_MODE_2_1 | \*data == sy6529_CHARGE_MODE_1_1/(*data == sy6529_CHARGE_MODE_2_1) || (*data == sy6529_CHARGE_MODE_1_1)/' \
            drivers/power/oplus/v1/voocphy/oplus_sy6529.c
          # 3) ipa_hw_stats fortify 误报：代码已有 sizeof(dbg_buff)<count+1 守卫，
          #    clang-12 内联后无法静态证明 count 范围而误触发 __bad_copy_to；
          #    _copy_from_user（arm64 内联版，自带 access_ok）绕过 fortify 检查
          sed -i 's/missing = copy_from_user(dbg_buff, ubuf, count);/missing = _copy_from_user(dbg_buff, ubuf, count);/' \
            drivers/platform/msm/ipa/ipa_v3/ipa_hw_stats.c
          echo "===== 校验 ====="
          grep -n "CHARGE_MODE_2_1) ||" drivers/power/oplus/v1/voocphy/oplus_sy6529.c
          grep -n "_copy_from_user(dbg_buff" drivers/platform/msm/ipa/ipa_v3/ipa_hw_stats.c
          grep -n "Werror=parentheses" drivers/power/oplus/v1/Makefile || echo "voocphy 严格标志已移除"

      - name: 适配编译（C99 inline 语义修正）
        working-directory: src
        run: |
          # clang-12 严格按 C99 处理 inline：头文件 `inline int f();` 声明 + 跨 TU 调用
          # 报 "always_inline function body not available"；dma-buf.c 的 `inline int f(){}`
          # 定义在 C99 下也不导出外部符号。统一改为普通外部函数（与 gnu89 语义等价）。
          sed -i 's/^inline int oplus_is_dma_buf_file/int oplus_is_dma_buf_file/' \
            include/soc/oplus/lowmem_dbg.h \
            drivers/soc/oplus/lowmem_dbg/lowmem_dbg.h \
            drivers/dma-buf/dma-buf.c
          echo "===== 校验 ====="
          grep -n "int oplus_is_dma_buf_file" include/soc/oplus/lowmem_dbg.h drivers/dma-buf/dma-buf.c

      - name: gcc-wrapper.py 兼容 Python3
        working-directory: src
        run: |
          python3 - <<'PY'
          p = 'scripts/gcc-wrapper.py'
          s = open(p).read()
          s = s.replace('print "error, forbidden warning:", m.group(2)',
                        'print("error, forbidden warning:", m.group(2))')
          s = s.replace('print line,', "print(line, end='')")
          s = s.replace("print args[0] + ':',e.strerror",
                        "print(args[0] + ':', e.strerror)")
          s = s.replace("print 'Is your PATH set correctly?'",
                        "print('Is your PATH set correctly?')")
          s = s.replace("print ' '.join(args), str(e)",
                        "print(' '.join(args), str(e))")
          # py3: proc.stderr 产出 bytes，先 decode 再逐行处理
          s = s.replace("for line in proc.stderr:",
                        "for line in (raw.decode('utf-8', 'replace') for raw in proc.stderr):")
          # clang-12 相比原厂 clang-10 告警更多，不再因 warning 终止构建（仅打印）
          s = s.replace("if m and m.group(2) not in allowed_warnings:",
                        "if False:")
          open(p, 'w').write(s)
          import ast; ast.parse(s)
          print('gcc-wrapper.py 已转 Python3，语法 OK')
          PY

      - name: 写入 Docker 配置片段
        run: |
          cat > docker.config <<'EOF'
          # 致命项
          CONFIG_PID_NS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_BRIDGE_NETFILTER=y
          # 必要项
          CONFIG_CGROUP_PIDS=y
          CONFIG_IPC_NS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          EOF
          echo "--- 片段内容 ---"; cat docker.config

      - name: 生成配置
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: clang-12
          REAL_CC: clang-12
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          make O=out vendor/kona-perf_defconfig
          cat ../docker.config >> out/.config
          make O=out olddefconfig
          echo "===== 关键项核对 ====="
          for k in CONFIG_PID_NS CONFIG_CGROUP_DEVICE CONFIG_BRIDGE_NETFILTER \
                   CONFIG_CGROUP_PIDS CONFIG_IPC_NS CONFIG_POSIX_MQUEUE \
                   CONFIG_OVERLAY_FS CONFIG_VETH CONFIG_MEMCG \
                   CONFIG_MODVERSIONS CONFIG_MODULE_SIG_FORCE; do
            printf '%-32s %s\n' "$k" "$(grep -E "^$k=" out/.config || echo '未开启')"
          done
          grep -q '^CONFIG_PID_NS=y' out/.config || { echo "!! PID_NS 未打开"; exit 1; }
          grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config || { echo "!! 模块签名校验被关，异常"; exit 1; }
          grep -q '^CONFIG_LOCALVERSION="-perf"' out/.config || { echo "!! LOCALVERSION 不是 -perf"; exit 1; }
          printf '%-32s %s\n' "CONFIG_LOCALVERSION" "$(grep '^CONFIG_LOCALVERSION=' out/.config)"

      - name: 编译内核
        working-directory: src
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: clang-12
          REAL_CC: clang-12
          CLANG_TRIPLE: aarch64-linux-gnu-
          KCFLAGS: -Wno-error -Wno-unused-command-line-argument
        run: |
          make O=out -j"$(nproc)" Image
          ls -la out/arch/arm64/boot/Image

      - name: 校验产物
        working-directory: src
        run: |
          python3 - <<'PY'
          d = open('out/arch/arm64/boot/Image','rb').read()
          assert d[0x38:0x3c] == b'ARM\x64', '不是合法 arm64 Image'
          print(f'arm64 Image 校验通过，大小 {len(d)} 字节')
          PY
          cp out/.config ../kernel.config

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kebab-kernel-image
          path: |
            src/out/arch/arm64/boot/Image
            kernel.config
          if-no-files-found: error
          retention-days: 14
